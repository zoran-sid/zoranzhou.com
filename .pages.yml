# Pages CMS: saving commits PUBLIC content to the selected GitHub branch.
# Keep private drafts in the existing external Inbox, not in this editor.
media:
  - name: note-images
    label: 随记配图（上传后即公开）
    input: public/writing-images/notes
    output: /writing-images/notes
    extensions: [jpg, jpeg, png, webp, avif, gif]
    rename: random
  - name: ticket-images
    label: 票根照片（上传后即公开）
    input: public/ticket-images
    output: /ticket-images
    extensions: [jpg, jpeg, png, webp, avif]
    rename: random

content:
  - name: notes
    label: 随记
    type: collection
    path: src/content/blog/notes
    format: yaml-frontmatter
    subfolders: false
    exclude: [README.md]
    filename:
      template: "note-{fields.slug}.md"
      field: false
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      search: [title, body]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: body
        label: 想记下什么？
        type: rich-text
        required: true
        description: 写几句话，也可以插入照片。保存会提交到 GitHub；生产分支构建成功后公开。
        options:
          format: markdown
          media: note-images
          switcher: false
      - name: title
        label: 标题（可以保留默认值）
        type: string
        default: 随记
        required: true
      - name: location
        label: 地点（可选）
        type: string
        description: 可以只填城市或地点名称，例如“香港 · 西贡”。留空则不显示。
        options:
          maxlength: 100
      - name: locationUrl
        label: 地图链接（可选）
        type: string
        description: 粘贴高德、百度、Apple Maps 或 Google Maps 的分享链接，只需网址。
        pattern:
          regex: '^https?://\S+$'
          message: 请粘贴以 https:// 或 http:// 开头的完整网址。
      - name: date
        label: 记录时间（香港／北京时间）
        type: date
        required: true
        description: 统一按 UTC+8 保存。跨时区旅行时，请按香港／北京时间调整。
        options:
          time: true
          # CMS serializes datetime-local on its server. XXX would use that
          # server's zone; a quoted literal preserves the author's wall time.
          format: "yyyy-MM-dd'T'HH:mm:ss'+08:00'"
      # UUID is also the Astro permalink. Editing text/title never changes the URL.
      - name: slug
        type: uuid
        hidden: true
      - name: format
        type: string
        default: note
        hidden: true
      - name: publication
        type: string
        default: approved
        hidden: true
      - name: lang
        label: 语言
        type: select
        default: zh-CN
        options:
          values:
            - name: zh-CN
              label: 中文
            - name: en
              label: English
      - name: draft
        type: boolean
        default: false
        hidden: true

  - name: tickets
    label: 票根
    type: collection
    path: src/content/tickets
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "ticket-{fields.slug}.md"
      field: false
    operations:
      rename: false
    view:
      fields: [title, date, type]
      primary: title
      sort: [date, title]
      search: [title, location, body]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 名称
        type: string
        required: true
        description: 电影、演出或这段旅程的名字。
        options:
          maxlength: 160
      - name: date
        label: 票面日期
        type: date
        required: true
        description: 按活动或出行当天的日期排序，和上传时间无关。
        options:
          time: false
          format: yyyy-MM-dd
      - name: type
        label: 类型
        type: select
        required: true
        options:
          values:
            - { name: movie, label: 电影 }
            - { name: concert, label: 音乐会 }
            - { name: theatre, label: 戏剧 }
            - { name: comedy, label: 喜剧 }
            - { name: performance, label: 演出（音乐会／戏剧／喜剧等） }
            - { name: exhibition, label: 展览 }
            - { name: sport, label: 赛事 }
            - { name: train, label: 火车 }
            - { name: flight, label: 机票 }
            - { name: receipt, label: 消费小票 }
            - { name: dining, label: 餐饮小票 }
            - { name: invoice, label: 发票 }
            - { name: travel, label: 旅行 }
            - { name: other, label: 其他 }
      - name: details
        label: 分类票面信息（可选）
        type: block
        list: false
        blockKey: variant
        description: 选择与类型对应的票面模板，只填写该分类需要的信息。顶层“类型”仍用于网站筛选，请保持两者一致。
