      - name: photos
        label: 照片（可选）
        type: image
        description: 上传后即公开。请先遮住二维码、条码、订单号、证件信息及不想公开的姓名，并使用已处理定位信息的导出图片。为避免 Pages CMS 托管上传的 413 错误，请先压缩到 3 MB 以内（建议 WebP/JPEG）。
        options:
          media: ticket-images
          multiple: true
          unique: true
      - name: location
        label: 地点（可选）
        type: string
        options:
          maxlength: 100
      - name: body
        label: 想记住的事（可选）
        type: rich-text
        description: 写一句感受或一段故事。保存会提交公开内容到 GitHub；构建成功后出现在生活 → 票根。
        options:
          format: markdown
          media: ticket-images
          switcher: false
      - name: note
        label: 关联随记（可选）
        type: reference
        description: 搜索标题，选择已有随记。票根和随记会互相显示链接；一条随记可以关联多张票根。
        options:
          collection: notes
          multiple: false
          search: "title,body"
          value: "{fields.slug}"
          label: "{fields.title} · {fields.lang}"
      - name: lang
        label: 语言
        type: select
