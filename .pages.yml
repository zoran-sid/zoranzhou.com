          - name: movie
            label: 电影
            fields:
              - name: cinema
                label: 影院
                type: string
              - name: startTime
                label: 开始时间
                type: string
              - name: endTime
                label: 结束时间
                type: string
              - name: auditorium
                label: 影厅
                type: string
              - name: seat
                label: 座位
                type: string
              - name: collectionCode
                label: 取票码
                type: string
          - name: performance
            label: 演出
            fields:
              - name: performance
                label: 演出／巡演名称
                type: string
              - name: artist
                label: 艺术家／表演者
                type: string
              - name: venue
                label: 场地
                type: string
              - name: startTime
                label: 开始时间
                type: string
              - name: endTime
                label: 结束时间
                type: string
              - name: section
                label: 区域
                type: string
              - name: seat
                label: 座位
                type: string
          - name: concert
            label: 音乐会
            fields:
              - name: performance
                label: 演出／巡演名称
                type: string
              - name: artist
                label: 艺术家／表演者
                type: string
              - name: venue
                label: 场地
                type: string
              - name: startTime
                label: 开始时间
                type: string
              - name: endTime
                label: 结束时间
                type: string
              - name: section
                label: 区域
                type: string
